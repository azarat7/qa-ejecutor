[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-ejecutor"
version = "0.1.0"
description = "Ejecutor compartido de pruebas automatizadas con flujo BDD nativo de Xray (ADR-008)"
readme = "README.md"
requires-python = ">=3.10"
# Versiones fijas: la de Playwright coincide con la imagen oficial que usa el flujo reutilizable.
dependencies = [
    "playwright==1.63.0",
    "pytest==9.2.0",
    "pytest-bdd==9.0.1",
    "requests==2.34.2",
]

[project.optional-dependencies]
dev = ["ruff==0.17.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p pytester -p no:cacheprovider"

[tool.ruff]
line-length = 150
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "C90", "S", "PT012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.ruff.lint.mccabe]
max-complexity = 10
