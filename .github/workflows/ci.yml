# Revisión de qa-ejecutor en cada cambio: ruff y pruebas (sin Sonar mientras sea demo, ADR-008).
name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Instalar
        run: python -m pip install -e ".[dev]"
      - name: Revisar el código con ruff
        run: ruff check
      - name: Pruebas
        run: pytest
